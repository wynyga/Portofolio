# Local stand-in for Upstash Redis, for testing the Crew wall against a real Redis.
#
#   docker compose -f docker-compose.redis.yml up -d
#
# Then put these two lines in .env.local and restart `npm run dev`:
#   UPSTASH_REDIS_REST_URL=http://localhost:8079
#   UPSTASH_REDIS_REST_TOKEN=local-dev-token
#
# Stop it (and drop the data) with:
#   docker compose -f docker-compose.redis.yml down
services:
  redis:
    image: redis:7-alpine
  redis-http:
    # Speaks the same REST protocol as Upstash, in front of the local Redis.
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
